name: experimental-intel-xe

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intel-xe-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"

jobs:
  intel-xe:
    name: Build and host-test Intel Xe + ANV
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - name: Install LLVM 21 and graphics build dependencies
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            clang-21 lld-21 llvm-21 llvm-21-dev libclang-21-dev libclang-cpp21-dev libclang-rt-21-dev \
            glslang-tools ninja-build cmake pkg-config libdrm-dev git curl zstd zip qemu-system-x86 ovmf
          echo /usr/lib/llvm-21/bin >> "$GITHUB_PATH"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-intel-xe-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'crates/stela-boot/Cargo.lock') }}
          restore-keys: cargo-intel-xe-

      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustc --version
          clang --version | head -1
          glslangValidator --version | head -1

      - uses: actions/cache@v4
        with:
          path: .tools/gpu
          key: gpu-tools-${{ runner.os }}-${{ hashFiles('xtask/src/gpu/toolchain.rs') }}

      - uses: actions/cache@v4
        id: spirv
        with:
          path: .tools/spirv
          key: spirv-${{ runner.os }}-llvm21-${{ hashFiles('.github/spirv.sh') }}

      - name: Build pinned SPIR-V host libraries
        run: |
          if [[ "${{ steps.spirv.outputs.cache-hit }}" != true ]]; then
            bash .github/spirv.sh .tools/spirv
          fi
          echo "PKG_CONFIG_PATH=$PWD/.tools/spirv/lib/pkgconfig" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: target/gpu
          key: intel-xe-gpu-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'xtask/src/gpu/**', 'crates/stela-driver-gpu/**', 'third_party/patches/**', 'third_party/*.sparse', '.github/spirv.sh') }}

      - name: Fetch pinned upstream GPU sources
        run: cargo xtask gpu fetch

      - name: Run Intel ANV-on-Xe host integration test
        run: cargo xtask gpu anv-test --jobs 2

      - name: Test Intel firmware selection, including Tiger Lake GT1
        run: cargo test --locked -p stela-loader host_firmware::recipes::tests::an_intel_gpu_requires_the_files_xe_names_for_its_platform

      - name: Test the Intel Xe driver crate
        run: cargo test --locked -p stela-driver-gpu --features xe-port --lib

      - name: Build experimental Intel Xe UEFI image
        env:
          STELA_RELEASE: "1"
        run: |
          cargo xtask boot build --xe --release
          grep -Fx intel target/gpu/nvk/vulkan-drivers
          efi=target/boot/x86_64-unknown-uefi/release/stela-deploy.efi
          [[ -s "$efi" ]] || { echo "::error::UEFI image was not produced"; exit 1; }
          [[ "$(head -c 2 "$efi")" == MZ ]] || { echo "::error::UEFI image is not a PE executable"; exit 1; }

      - name: Boot the Intel Xe UEFI image in QEMU with OVMF
        run: |
          efi=target/boot/x86_64-unknown-uefi/release/stela-deploy.efi
          # The system-kernel scenario deliberately exits through QEMU's
          # isa-debug-exit device with IDLE_EXIT=(0x10 << 1) | 1, i.e. 33.
          # xtask records that status after verifying the guest's serial log.
          # Accept it only when the structured report says every kernel check passed.
          set +e
          cargo xtask boot run --image "$efi" --output target/intel-xe-qemu-boot --timeout 120
          qemu_status=$?
          set -e
          test "$qemu_status" -eq 33
          test -s target/intel-xe-qemu-boot/serial.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("target/intel-xe-qemu-boot/run.json").read_text())
          assert report["scenario"] == {"passed": True}, report.get("scenario")
          assert report["qemu_returncode"] == 33, report.get("qemu_returncode")
          assert report["returncode"] == 33, report.get("returncode")
          assert report["timed_out"] is False, report.get("timed_out")
          PY
          {
            echo "### QEMU UEFI boot test"
            echo
            echo "- Intel Xe UEFI image launched through OVMF: yes"
            echo "- System-kernel scenario: passed (expected QEMU debug-exit status 33)"
            echo "- This checks UEFI boot flow in emulation only; QEMU does not emulate the target Intel Xe GPU."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package and verify the experimental EFI USB files
        run: |
          efi=target/boot/x86_64-unknown-uefi/release/stela-deploy.efi
          mkdir -p dist/usb/EFI/BOOT
          cp "$efi" dist/stela-intel-xe-experimental.efi
          cp "$efi" dist/usb/EFI/BOOT/BOOTX64.EFI
          cat > dist/usb/README-INSTALL.txt <<'EOF'
          STELA INTEL XE — EXPERIMENTAL USB BOOT TEST

          This is an experimental UEFI test image for supported Intel Xe GPUs.
          It is NOT a macOS/Windows application and does not install an operating
          system. Physical Intel GPU acceleration has not yet been verified.

          USB preparation:
          1. Back up the USB drive; use a spare USB drive.
          2. Format it as FAT32 (GPT or MBR is fine for UEFI removable boot).
          3. Copy the entire EFI folder from this package to the USB drive's root.
          4. Safely eject the USB drive.
          5. On the test PC, disable Secure Boot temporarily and choose the USB
             device from the one-time UEFI boot menu.

          This package only contains the UEFI boot application. It does not
          erase or partition the PC's internal drive. Do not run disk or install
          operations during this first hardware bring-up test.

          If it fails to boot, record the exact error or photograph the screen.
          A successful boot alone does not prove 3D acceleration.
          EOF
          (
            cd dist/usb
            zip -qr ../stela-intel-xe-usb-test.zip .
          )
          unzip -t dist/stela-intel-xe-usb-test.zip
          unzip -Z1 dist/stela-intel-xe-usb-test.zip | grep -Fx 'EFI/BOOT/BOOTX64.EFI'
          cmp "$efi" dist/stela-intel-xe-experimental.efi
          unzip -p dist/stela-intel-xe-usb-test.zip EFI/BOOT/BOOTX64.EFI | cmp - "$efi"
          sha256sum dist/stela-intel-xe-experimental.efi dist/stela-intel-xe-usb-test.zip | tee dist/SHA256SUMS
          {
            echo "### Experimental Intel Xe build"
            echo
            echo "- ANV linked: yes"
            echo "- UEFI PE image: yes"
            echo "- USB test ZIP: yes"
            echo "- Physical GPU tested: no (requires target PC)"
            echo
            cat dist/SHA256SUMS
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: stella-intel-xe-experimental
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  windows-updater:
    name: Build Windows in-place USB updater
    needs: intel-xe
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Put LLVM on PATH
        shell: bash
        run: |
          echo 'C:/Program Files/LLVM/bin' >> "$GITHUB_PATH"
          clang --version | head -1

      - name: Install Rust and Windows target
        shell: bash
        run: |
          rustup toolchain install
          rustup target add x86_64-pc-windows-msvc
          rustc --version
          command -v clang
          command -v llvm-lib

      - uses: actions/download-artifact@v4
        with:
          name: stella-intel-xe-experimental
          path: dist

      - name: Build Windows updater with the Intel Xe EFI image embedded
        shell: bash
        env:
          STELA_EFI: ${{ github.workspace }}/dist/stela-intel-xe-experimental.efi
        run: |
          test -s "$STELA_EFI"
          cargo build --release --locked -p stela-cli --target x86_64-pc-windows-msvc
          exe=target/x86_64-pc-windows-msvc/release/stela.exe
          test -s "$exe"
          "$exe" --version
          python - <<'PY'
          from pathlib import Path
          exe = Path("target/x86_64-pc-windows-msvc/release/stela.exe").read_bytes()
          efi = Path("dist/stela-intel-xe-experimental.efi").read_bytes()
          assert efi in exe, "Windows updater does not contain the Intel Xe EFI image"
          print(f"Verified embedded Intel Xe EFI image ({len(efi)} bytes)")
          PY

      - name: Package updater and safe-update instructions
        shell: bash
        run: |
          mkdir -p dist/windows-updater
          cp target/x86_64-pc-windows-msvc/release/stela.exe dist/windows-updater/
          cat > dist/windows-updater/README-UPDATE.txt <<'EOF'
          STELA INTEL EDITION — WINDOWS IN-PLACE USB UPDATER
          
          This package contains the experimental Intel Xe stela.efi image
          embedded in the Windows stela.exe application.
          
          IMPORTANT: Use this only with a USB that already contains a Stela
          setup. This is an update, not a new installer creator.
          
          SAFEST PROCEDURE
          1. Back up important files from the USB first.
          2. Extract this ZIP to a folder on Windows.
          3. Open PowerShell as Administrator.
          4. Find the USB's drive letter in File Explorer (example: E:).
          5. In PowerShell, change to the extracted folder.
          6. Preview the update first:
          
             .\stela.exe --dry-run update E:\
          
             Replace E:\ with the USB's actual drive letter.
          7. Read the complete preview. It must identify the existing Stela
             setup and must not say it will erase or recreate the USB.
          8. Only if the preview is correct, run:
          
             .\stela.exe update E:\
          
          The update command replaces Stela's bootloader and updates the
          Stela boot files only when required. Do not add --macos: that would
          request a macOS installer-medium update. The existing macOS
          installer medium is intended to be preserved by an ordinary
          "update" command.
          
          If the dry run refuses the stick, reports an unknown setup, or
          reports that the bootloader interface is incompatible, STOP.
          Do not run create, format, diskpart, or any erase command. Keep the
          current USB unchanged and provide the exact error message.
          
          This is experimental software. Back up the USB before any write.
          Physical Intel Xe graphics support is not yet verified.
          EOF
          (
            cd dist
            zip -qr stella-intel-xe-windows-updater.zip windows-updater
          )
          unzip -t dist/stella-intel-xe-windows-updater.zip
          sha256sum dist/stella-intel-xe-windows-updater.zip | tee dist/stella-intel-xe-windows-updater.SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: stella-intel-xe-windows-updater
          path: |
            dist/stella-intel-xe-windows-updater.zip
            dist/stella-intel-xe-windows-updater.SHA256
          if-no-files-found: error
          retention-days: 30
